<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Video Ara</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1720; color: #e8eef4; font-family: Arial, Helvetica, sans-serif; }
  #top { display: flex; padding: 24px 32px; background: #16222f; }
  #q { flex: 1; font-size: 28px; padding: 14px 18px; border: 3px solid #2c3e50; border-radius: 8px; background: #0f1720; color: #fff; }
  button { font-size: 26px; padding: 14px 28px; margin-left: 16px; border: 3px solid transparent; border-radius: 8px; background: #2c3e50; color: #fff; cursor: pointer; }
  #q:focus, button:focus { outline: none; border-color: #5ec8e5; background-color: #1d5a6e; }
  #msg { padding: 20px 32px; font-size: 24px; color: #9fb3c4; }
  #grid { display: flex; flex-wrap: wrap; padding: 8px 24px 40px; }
  .card { display: block; width: 23%; margin: 1%; padding: 0; text-align: left; background: #16222f; border: 4px solid transparent; border-radius: 8px; overflow: hidden; }
  .card img { display: block; width: 100%; height: auto; }
  .card div { padding: 10px 12px; font-size: 20px; line-height: 1.3; height: 3.2em; overflow: hidden; }
  .card:focus { border-color: #5ec8e5; background: #1d3a4a; }
  #player { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 10; }
  #player.on { display: block; }
  #bar { height: 72px; padding: 10px 24px; background: #16222f; }
  #bar button { margin: 0 16px 0 0; padding: 8px 24px; }
  #frame { position: absolute; top: 72px; left: 0; width: 100%; height: calc(100% - 72px); border: 0; }
  #player.wide #bar { display: none; }
  #player.wide #frame { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="top">
  <input id="q" type="text" placeholder="Video ara" autocomplete="off">
  <button id="go">Ara</button>
</div>
<div id="msg">Bir şey yaz ve Ara'ya bas.</div>
<div id="grid"></div>

<div id="player">
  <div id="bar">
    <button id="close">Kapat</button>
    <button id="play">Oynat</button>
    <button id="pause">Duraklat</button>
    <button id="fs">Tam ekran</button>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<script>
// YouTube Data API v3 anahtarını buraya yaz (Google Cloud'da ücretsiz alınır).
var API_KEY = 'AIzaSyD2R2-8-2sjEcWmVugEZk5lJuIeDuvcsc8';

var lastCard = null;
function $(id) { return document.getElementById(id); }
function setMsg(t) { $('msg').textContent = t; }

function search() {
  var q = $('q').value.replace(/^\s+|\s+$/g, '');
  if (!q) { return; }
  if (API_KEY.indexOf('BURAYA') === 0) { searchPiped(q); return; }
  setMsg('Aranıyor...');
  var x = new XMLHttpRequest();
  x.open('GET', 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=12&q=' + encodeURIComponent(q) + '&key=' + API_KEY);
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) {}
    if (x.status !== 200 || !d) {
      setMsg('Arama başarısız' + (d && d.error ? ': ' + d.error.message : '.'));
      return;
    }
    var out = [], its = d.items || [];
    for (var i = 0; i < its.length; i++) {
      out.push({ id: its[i].id.videoId, title: its[i].snippet.title, html: true, thumb: its[i].snippet.thumbnails.medium.url });
    }
    render(out);
  };
  x.onerror = function () { setMsg('Bağlantı hatası.'); };
  x.send();
}

// Anahtarsız mod: halka açık Piped sunucularını sırayla dener.
var PIPED = ['https://pipedapi.kavin.rocks'];
var pipedListLoaded = false;

function getJson(url, ok, fail) {
  var x = new XMLHttpRequest();
  x.open('GET', url);
  x.timeout = 7000;
  x.onload = function () {
    var d = null;
    if (x.status === 200) { try { d = JSON.parse(x.responseText); } catch (e) {} }
    if (d) { ok(d); } else { fail(); }
  };
  x.onerror = fail;
  x.ontimeout = fail;
  x.send();
}

function searchPiped(q) {
  setMsg('Aranıyor...');
  var tryAt = function (i) {
    if (i >= 10) { setMsg('Çalışan arama sunucusu bulunamadı. Biraz sonra tekrar dene.'); return; }
    if (i >= PIPED.length) {
      if (pipedListLoaded) { setMsg('Çalışan arama sunucusu bulunamadı. Biraz sonra tekrar dene.'); return; }
      pipedListLoaded = true;
      getJson('https://piped-instances.kavin.rocks/', function (list) {
        for (var k = 0; k < list.length; k++) {
          if (list[k].api_url && PIPED.indexOf(list[k].api_url) < 0) { PIPED.push(list[k].api_url); }
        }
        tryAt(i);
      }, function () { setMsg('Çalışan arama sunucusu bulunamadı. Biraz sonra tekrar dene.'); });
      return;
    }
    getJson(PIPED[i] + '/search?q=' + encodeURIComponent(q) + '&filter=videos', function (d) {
      var out = [], its = d.items || [];
      for (var j = 0; j < its.length; j++) {
        var m = /[?&]v=([\w-]{11})/.exec(its[j].url || '');
        if (m) { out.push({ id: m[1], title: its[j].title, html: false, thumb: its[j].thumbnail }); }
      }
      if (out.length) { render(out); } else { tryAt(i + 1); }
    }, function () { tryAt(i + 1); });
  };
  tryAt(0);
}

function render(items) {
  var g = $('grid');
  g.innerHTML = '';
  setMsg(items.length ? '' : 'Sonuç bulunamadı.');
  for (var i = 0; i < items.length; i++) {
    (function (it) {
      var b = document.createElement('button');
      b.className = 'card';
      var img = document.createElement('img');
      img.src = it.thumb;
      var t = document.createElement('div');
      if (it.html) { t.innerHTML = it.title; } else { t.textContent = it.title; } // Google başlığı HTML-kaçışlı gelir
      b.appendChild(img);
      b.appendChild(t);
      b.onclick = function () { lastCard = b; openVideo(it.id); };
      g.appendChild(b);
    })(items[i]);
  }
  if (g.firstChild) { g.firstChild.focus(); }
}

function openVideo(id) {
  $('frame').src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&hl=tr&vq=hd1080&enablejsapi=1';
  $('player').className = 'on';
  $('play').focus();
}

function closeVideo() {
  var cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  $('frame').src = 'about:blank';
  $('player').className = '';
  if (lastCard) { lastCard.focus(); }
}

function cmd(name) {
  var w = $('frame').contentWindow;
  if (w) { w.postMessage(JSON.stringify({ event: 'command', func: name, args: [] }), '*'); }
}

function toggleFs() {
  var p = $('player');
  var cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  var r = p.requestFullscreen || p.webkitRequestFullscreen;
  if (r) {
    try { r.call(p); } catch (e) {}
  }
  // Tarayıcı tam ekranı vermezse sayfa içinde ekranı kaplayan moda geç
  setTimeout(function () {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) { p.className = 'on wide'; }
  }, 400);
}

$('go').onclick = search;
$('q').onkeydown = function (e) { if (e.keyCode === 13) { search(); } };
$('close').onclick = closeVideo;
$('fs').onclick = toggleFs;
$('play').onclick = function () { cmd('playVideo'); };
$('pause').onclick = function () { cmd('pauseVideo'); };
document.addEventListener('keydown', function (e) {
  // 27 = Esc, 10009 = Samsung kumandası Geri tuşu
  var pc = $('player').className;
  if (pc.indexOf('on') === 0 && (e.keyCode === 27 || e.keyCode === 10009)) {
    if (pc === 'on wide') { $('player').className = 'on'; } else { closeVideo(); }
  }
});
</script>
</body>
</html>
